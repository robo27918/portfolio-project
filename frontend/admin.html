<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

   <div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h4 class="mb-4 fw-semibold">Add Project</h4>

                    <form id="projectForm" 
                        action="https://6lfcyxhtkb.execute-api.us-east-1.amazonaws.com/projects" 
                        method="post">
                        <!-- project name -->
                         <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" 
                                          class="form-control"
                                          id="title"
                                          name="title"
                                    >
                                    <label for="title">Project Title</label>
                                </div>
                            </div>
                            <!-- project url -->
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" 
                                          class="form-control"
                                          id="url"
                                          placeholder="Project Url"
                                    >
                                    <label for="url">project url</label>
                                </div>
                            </div>
                         <!--github url  -->
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" 
                                          class="form-control"
                                          id="github_url"
                                          
                                          placeholder="github-url"
                                    >
                                    <label for="github_url">github url</label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label text-muted">Project Description</label>
                            <textarea class="form-control" 
                                     rows="4" 
                                     placeholder="Describe your project"
                                     name="description" 
                                     id="description">
                            </textarea>
                        </div>
                        <!-- actions -->
                         <div class="d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-outline-secondary">
                                Cancel
                            </button>
                            <button type="submit" class="btn btn-primary px-4">
                                Save
                            </button>
                         </div>
                    
                    </form>
                </div>
            </div>

        </div>
    </div>
   </div> 

    <div class="container">
        <h3>Add skill</h3>
        <form id="skillForm" action="https://6lfcyxhtkb.execute-api.us-east-1.amazonaws.com/skills" method="post">
            <div class="input-container">
                <label class="column"for="">Enter skill</label>
                <input class="column"type="text" id="skill_title" name="skill_title">
                <label for="category" class="column">Category</label>
                <input type="text" class="column" name="category" id="category">
            </div>
            <button type="submit">Submit</button>
           
        </form>

    </div>
    <div class="container">
        <h2>All Projects</h2>
        <table class="table table-hover">
            <thead>
                 <tr>
                    <th>Id</th>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Technologies</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="project-table-body">
            </tbody>
        </table>
    </div>

    <div class="container">
           <h2>All skills</h2>
            <table class="table table-hover">
                <thead>
                     <tr>
                        <th>Id</th>
                        <th>Skill</th>
                        <th>Category</th>
                        <th>active</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="skill-table-body">
                </tbody>
            </table>
    </div>
    <!-- edit modal -->
     <div class="modal fade" id="editProjectModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editModalLabel">Edit Item</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <form id="editProjectForm">
                        <input type="hidden" id="editProjectId">

                        <div class="mb-3">
                            <label for="editTitle" class="form-label">Title</label>
                            <input type="text" class="form-control" id="editTitle" name="title">
                        </div>

                    </form>
                </div>
                <div class="modal-footer mb-3">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" form="editProjectForm" class="btn btn-primary">Save</button>
                </div>
            </div>
        </div>

     </div>
     
    <!-- edit skills modal -->
     <div class="modal fade" id="editSkillModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editModalLabel">Edit Item</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <form id="editSkillForm">
                        <input type="hidden" id="editSkillId">

                        <div class="mb-3">
                            <label for="editSkillTitle" class="form-label">Skill</label>
                            <input type="text" class="form-control" id="editSkillTitle" name="Skilltitle">
                        </div>
                        
                        <div class="mb-3">
                            <label for="editCategory" class="form-label">Category</label>
                            <input type="text" class="form-control" id="editCategory" name="Category">
                        </div>
                    </form>
                </div>
                <div class="modal-footer mb-3">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" form="editSkillForm" class="btn btn-primary">Save</button>
                </div>
            </div>
        </div>
        <div class="position-fixed bottom-0 end-0 p-3"style="z-index: 11">
           <div id="liveToast" class="toast align-items-center 
                                    text-bg-success border-0">
                <div class="d-flex">
                    <div class="toast-body" id="toastMessage">
                        Success!
                    </div>
                    <button class="btn-close btn-close-white me-2 m-auto"
                         data-bs-dismiss="toast"           
                    >

                    </button>
                </div>                    
            </div>
        </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
