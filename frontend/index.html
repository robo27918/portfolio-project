<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rob Toribio Portfolio</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top"> 
        <div class="container">
            <a href="" class="navbar-brand fw-bold">Rob Toribio Portfolio</a>
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target=""
            >
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a href="" class="nav-link">About</a></li>
                    <li class="nav-item"><a href="" class="nav-link">Blog</a></li>
                    <li class="nav-item"><a href="" class="nav-link">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>   

    <!--  -->
    <section class="py-5 my-5">
        <div class="container">
            <div class="row justify-content-center text-center">
                <div class="col-lg-8">
                    <h1 class="display-4 fw-light mb-4">
                        Hi, I'm Robert
                    </h1>
                    <p id="blurb" class="lead text-muted">I enjoy building full-stack apps and learning more about building applications</p>
                </div>
            </div>
        </div>
    </section>

    <!-- skill section -->
    <section id="skills" class="py-5 bg-light">
        <div class="container">
            <h2 class="text-center mb-5 fw-light">
                Skills
            </h2>
            <div class="row g-4">
                <div class="p-4 p-md-5 bg-light border rounded-4 shadow-sm">
                    <template id="skill-template">
                        <span class="badge 
                                    rounded-pill bg-dark 
                                    d-inline-flex 
                                    align-items-center 
                                    gap-2 px-3 py-2">

                            <img src="" 
                                width="100" 
                                height="75" alt="" 
                                class="round-circle">
                        </span>
                    </template>
                </div>
            </div>
        </div>
    </section>

    <!-- project section -->
     <section id="projects" class="py-5 bg-light">
        <div class="container">
            <h2 class="text-center mb-5 fw-light">
                Projects
            </h2>
            <div id="project-holder" class="row g-4">
                <template id="project-template">
                    <div class="col-md-6 col-lg-4">
                        <div class="card border-0 shadow-sm h-100">
                            <img src="" alt="" class="card-img-top" alt="Project">
                            <div class="card-body">
                                <h5 class="card-title"></h5>
                                <p class="card-text text-muted"></p>
                            </div>
                            <div class="card-footer bg-white border-0">
                                <a href="" class="btn btn-sm btn-outline-dark">Github</a>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
     </section>
     
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
    <script src="index.js"></script>

</html>
